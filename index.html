<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Teacher's Day, Mam!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.15); text-align: center; max-width: 400px; width: 100%; border-top: 8px solid #ff4757; }
        h1 { color: #ff4757; font-size: 28px; margin-bottom: 5px; }
        .class-badge { background: #ff4757; color: white; padding: 3px 12px; border-radius: 15px; font-size: 14px; display: inline-block; margin-bottom: 15px; font-weight: bold; }
        p { color: #57606f; line-height: 1.6; font-size: 16px; }
        .photo-box { width: 100%; height: 220px; background: #f1f2f6; border-radius: 10px; margin: 20px 0; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px dashed #ff4757; }
        .photo-box img { width: 100%; height: 100%; object-fit: cover; }
        .badge { background: #2ed573; color: white; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; }
        .footer-text { font-weight: bold; color: #333; margin-top: 20px; border-top: 1px solid #f1f2f6; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">Special Greeting 🌟</div>
    <h1>Happy Teacher's Day!</h1>
    <div class="class-badge">To: [MS divya goyal] 👩‍🏫</div>
    
    <p>Aapne hamein sirf kitabi gyaan nahi, balki jeene ka sahi raasta dikhaya hai. Hamein ek behtar student banane ke liye aapka bahut-bahut dhanyawad, Mam!</p>
    
    <!-- Photo Section -->
    <div class="photo-box">
        <img src="https://unsplash.com" alt="Best Teacher">
    </div>

    <div class="footer-text">
        <p style="margin: 0; color: #ff4757;">From Your Student ❤️</p>
        <p style="margin: 5px 0 0 0; font-size: 18px; color: #2f3542;">Shivam</p>
        <p style="margin: 2px 0 0 0; font-size: 14px; color: #747d8c;">Class: 8th B</p>
    </div>
</div>

</body>
</html>
